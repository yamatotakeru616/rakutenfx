<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="3"/>

  <!-- チャートグリッド -->
  <line x1="24" y1="96" x2="168" y2="96" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4"/>
  <line x1="24" y1="140" x2="168" y2="140" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4"/>

  <!-- フィボナッチ上昇波形 (グロー効果付き) -->
  <polyline points="28,144 68,110 96,134 130,70 164,44" 
            fill="none" 
            stroke="url(#accentGrad)" 
            stroke-width="7" 
            stroke-linecap="round" 
            stroke-linejoin="round"
            filter="url(#glow)"/>

  <!-- エントリースターマーク -->
  <circle cx="164" cy="44" r="7" fill="#fbbf24" filter="url(#glow)"/>
  
  <!-- テキストロゴ -->
  <text x="96" y="172" fill="#94a3b8" font-size="14" font-weight="bold" font-family="sans-serif" text-anchor="middle" letter-spacing="1">RAKUTEN FX</text>
</svg>
