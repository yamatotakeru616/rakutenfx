<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accentGrad512" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="glow512" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad512)" stroke="#1e293b" stroke-width="6"/>

  <!-- チャートグリッド -->
  <line x1="60" y1="256" x2="452" y2="256" stroke="#1e293b" stroke-width="3" stroke-dasharray="8"/>
  <line x1="60" y1="360" x2="452" y2="360" stroke="#1e293b" stroke-width="3" stroke-dasharray="8"/>

  <!-- フィボナッチ上昇波形 (グロー効果付き) -->
  <polyline points="75,380 180,285 256,350 350,180 435,115" 
            fill="none" 
            stroke="url(#accentGrad512)" 
            stroke-width="18" 
            stroke-linecap="round" 
            stroke-linejoin="round"
            filter="url(#glow512)"/>

  <!-- エントリースターマーク -->
  <circle cx="435" cy="115" r="18" fill="#fbbf24" filter="url(#glow512)"/>
  
  <!-- テキストロゴ -->
  <text x="256" y="455" fill="#94a3b8" font-size="36" font-weight="bold" font-family="sans-serif" text-anchor="middle" letter-spacing="3">RAKUTEN FX AI</text>
</svg>
