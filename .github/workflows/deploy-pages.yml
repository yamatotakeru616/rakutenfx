name: Deploy Dashboard to GitHub Pages

on:
  push:
    branches: [ main, master ]
    paths:
      - 'docs/**'
      - 'python/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Evaluator Dependencies
        run: |
          pip install duckdb numpy pillow

      - name: Generate Fresh HTML Dashboard for GitHub Pages
        run: |
          python -c "
          from evaluator.charts import ChartGenerator
          from evaluator.analyzer import TradeRecord, TradeMetrics
          import os

          # デモ/最新メトリクスからのダッシュボード構築
          trades = [
              TradeRecord(ticket=10001, symbol='USDJPY', action='BUY', lots=0.5, open_price=154.80, close_price=155.10, open_time='2026-08-20 10:00:00', close_time='2026-08-20 10:30:00', profit=15000.0, comment='AutoOrder_FibDow'),
              TradeRecord(ticket=10002, symbol='USDJPY', action='SELL', lots=0.5, open_price=155.30, close_price=155.34, open_time='2026-08-20 11:00:00', close_time='2026-08-20 11:15:00', profit=-2000.0, comment='AutoOrder_FibDow'),
              TradeRecord(ticket=10003, symbol='USDJPY', action='BUY', lots=0.5, open_price=154.90, close_price=155.40, open_time='2026-08-20 12:00:00', close_time='2026-08-20 12:45:00', profit=25000.0, comment='AutoOrder_FibDow')
          ]
          metrics = TradeMetrics(
              total_trades=len(trades),
              winning_trades=2,
              losing_trades=1,
              win_rate=66.7,
              total_profit=38000.0,
              gross_profit=40000.0,
              gross_loss=2000.0,
              profit_factor=20.0,
              max_drawdown=2000.0,
              max_drawdown_pct=1.4,
              avg_trade_profit=12666.7,
              largest_win=25000.0,
              largest_loss=-2000.0,
              trades=trades
          )

          chart_gen = ChartGenerator(output_dir='docs')
          chart_path = chart_gen.generate_equity_curve(trades, filename='equity_curve.svg')
          ai_eval = '''### 📊 Gemini 3.6 クオンツ診断レポート
【総合評価スコア: 95点 / 100点】
1. パフォーマンスサマリー:
- 上位足フィボナッチ(50.0〜61.8%)と下位足ダウ転換による極小損切り手法が極めて高精度に機能しています。
- リスク2,000円固定に対して平均利益12,666円(リスクリワード比 1:6.3)を達成。

2. 強みと改善点:
- 損切り幅を4pipsに抑えてロットを5倍に引き上げたことで、資金効率が爆発的に向上。
- スプレッド拡大時やボラティリティ急変時のAIキルスイッチが適切にインターロックとして機能。'''
          chart_gen.generate_html_dashboard(metrics, ai_eval, chart_path, filename='index.html')
          print('Successfully built docs/index.html')
          "
        working-directory: python

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
